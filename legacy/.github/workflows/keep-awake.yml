# Keeps the Render free-tier server awake so the entity's own time (wake-ups, the minute timer) can run.
# Render sleeps after ~15 minutes without a request; GitHub runs this about every 10 minutes (it can be late under load).
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 -o /dev/null -w "%{http_code}\n" https://hub-of-me.onrender.com/ || true
